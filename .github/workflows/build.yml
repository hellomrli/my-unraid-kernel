name: Build Unraid packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        type: choice
        default: full-6.18.44
        options:
          - full-6.18.44
          - full-6.18.43
          - plugin-6.18.38
      publish_release:
        description: Attach successful outputs to an existing GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Existing release tag to receive the build outputs
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: unraid-cloud-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      # Official GCC image, pinned to the GCC 15.3.0 multi-architecture digest.
      image: gcc:15.3.0@sha256:486d5379b2d679f18bca957901d628952aa0ebc2d82817047bbef1dbfbc13d70
    env:
      BUILD_TARGET: ${{ inputs.target }}
      PUBLISH_RELEASE: ${{ inputs.publish_release }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake bc bison build-essential ca-certificates cpio \
            curl flex git gh initramfs-tools-core kmod libaio-dev \
            libattr1-dev libblkid-dev libcurl4-openssl-dev libelf-dev \
            libmount-dev libssl-dev libtirpc-dev libtool libudev-dev \
            libzstd-dev make pkg-config tar unzip uuid-dev xz-utils zip zstd
          rm -rf /var/lib/apt/lists/*
          gcc --version
          g++ --version
          df -h .

      - name: Select a container-safe build configuration
        shell: bash
        run: |
          set -euo pipefail
          case "$BUILD_TARGET" in
            full-6.18.44)
              source_env=config/build.env
              ;;
            full-6.18.43)
              source_env=config/build-6.18.43.env
              ;;
            plugin-6.18.38)
              source_env=config/build-6.18.38-plugin.env
              ;;
            *)
              printf 'Unsupported target: %s\n' "$BUILD_TARGET" >&2
              exit 2
              ;;
          esac

          build_env="$RUNNER_TEMP/build.env"
          cp "$source_env" "$build_env"
          compiler_version="$(gcc -dumpfullversion -dumpversion)"
          sed -i \
            -e 's|^CC=.*|CC=gcc|' \
            -e 's|^HOSTCC=.*|HOSTCC=gcc|' \
            -e 's|^CXX=.*|CXX=g++|' \
            -e 's|^HOSTCXX=.*|HOSTCXX=g++|' \
            -e "s|^EXPECTED_CC_VERSION=.*|EXPECTED_CC_VERSION=$compiler_version|" \
            -e 's|^JOBS=.*|JOBS=all|' \
            "$build_env"
          kernel_release="$(sed -n 's/^KERNEL_RELEASE=//p' "$build_env")"
          target_kernel_version="$(sed -n 's/^TARGET_KERNEL_VERSION=//p' "$build_env")"
          unraid_version="$(sed -n 's/^UNRAID_VERSION=//p' "$build_env")"
          i915_sriov_ref="$(sed -n 's/^I915_SRIOV_REF=//p' "$build_env")"
          package_build="$(sed -n 's/^PACKAGE_BUILD=//p' "$build_env")"
          package_build="${package_build:-1}"
          printf 'BUILD_ENV_FILE=%s\n' "$build_env" >> "$GITHUB_ENV"
          printf 'EXPECTED_CC_VERSION=%s\n' "$compiler_version" >> "$GITHUB_ENV"
          printf 'KERNEL_RELEASE=%s\n' "$kernel_release" >> "$GITHUB_ENV"
          printf 'TARGET_KERNEL_VERSION=%s\n' "$target_kernel_version" >> "$GITHUB_ENV"
          printf 'UNRAID_VERSION=%s\n' "$unraid_version" >> "$GITHUB_ENV"
          printf 'I915_SRIOV_REF=%s\n' "$i915_sriov_ref" >> "$GITHUB_ENV"
          printf 'PACKAGE_BUILD=%s\n' "$package_build" >> "$GITHUB_ENV"
          printf 'Resolved build configuration:\n'
          sed -n '1,42p' "$build_env"

      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          cloud_dir=cloud-artifacts
          mkdir -p "$cloud_dir/logs"
          scripts/all.sh 2>&1 | tee "$cloud_dir/logs/unraid-build.log"
          (
            cd out
            for checksum in *.sha256; do
              [ -f "$checksum" ] || continue
              sha256sum -c "$checksum"
            done
            checksum_manifest="sha256sums-$KERNEL_RELEASE.txt"
            if [ -f "$checksum_manifest" ]; then
              sha256sum -c "$checksum_manifest"
            fi
          )

          package_version="${I915_SRIOV_REF//./}"
          plugin_base="i915-sriov-${package_version}-${KERNEL_RELEASE}-${PACKAGE_BUILD}.txz"
          artifacts=(
            "out/$plugin_base"
            "out/$plugin_base.sha256"
            "out/$plugin_base.md5"
            out/i915-sriov-installed-modules.txt
            "out/verification-i915-$KERNEL_RELEASE.txt"
            "config/generated-linux-$KERNEL_RELEASE.config"
          )

          if [[ "$BUILD_TARGET" == full-* ]]; then
            zip_base="unRAIDServer-${UNRAID_VERSION}-Linux-${TARGET_KERNEL_VERSION}-i915-sriov-${I915_SRIOV_REF}-x86_64.zip"
            artifacts+=(
              "out/$zip_base"
              "out/$zip_base.sha256"
              "out/bzimage-$KERNEL_RELEASE"
              "out/sha256sums-$KERNEL_RELEASE.txt"
              out/syslinux-append-i915-sriov.txt
              "out/verification-$KERNEL_RELEASE.txt"
              out/zfs-installed-modules.txt
            )
          fi

          for artifact in "${artifacts[@]}"; do
            [ -s "$artifact" ] || {
              printf 'Expected build output is missing: %s\n' "$artifact" >&2
              exit 1
            }
            cp "$artifact" "$cloud_dir/"
          done
          find "$cloud_dir" -maxdepth 1 -type f -size +0c -printf '%f\t%s bytes\n' \
            | sort > "$cloud_dir/cloud-build-manifest.txt"
          df -h .

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unraid-${{ inputs.target }}-${{ github.sha }}
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
          path: |
            cloud-artifacts/

      - name: Attach outputs to an existing release
        if: ${{ success() && inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_TAG" ] || {
            printf 'release_tag is required when publish_release is enabled\n' >&2
            exit 2
          }
          mapfile -t assets < <(
            find cloud-artifacts -maxdepth 1 -type f -size +0c \
              ! -name 'cloud-build-manifest.txt' -print | sort
          )
          [ "${#assets[@]}" -gt 0 ] || {
            printf 'No release assets were produced\n' >&2
            exit 1
          }
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
