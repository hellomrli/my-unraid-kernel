name: Build Unraid packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        type: choice
        default: auto-latest
        options:
          - auto-latest
          - full-7.4.0-beta.1
          - full-6.18.44
          - full-6.18.43
      publish_release:
        description: Attach successful outputs to a GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag to receive the build outputs (created if missing)
        required: false
        type: string
      gcc_version:
        description: GCC version for the build container (e.g. 15.3.0); auto-latest normally passes this from the watch workflow
        required: false
        default: ''
        type: string
      auto_params:
        description: JSON parameters for the auto-latest target (generated by the watch-upstream workflow)
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: unraid-cloud-build
  cancel-in-progress: false

jobs:
  # Resolve the GCC toolchain before the build job starts, because the
  # container image must be known at job start. The compiler follows the
  # official Unraid kernel package: builds use max(15.3.0, official GCC).
  resolve-gcc:
    runs-on: ubuntu-24.04
    outputs:
      gcc_version: ${{ steps.resolve.outputs.gcc_version }}
    env:
      BUILD_TARGET: ${{ inputs.target }}
      GCC_VERSION_INPUT: ${{ inputs.gcc_version }}
      AUTO_PARAMS: ${{ inputs.auto_params }}
      PUBLISH_RELEASE: ${{ inputs.publish_release }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      # Fail before the multi-hour build starts instead of after it.
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PUBLISH_RELEASE" = "true" ] && [ -z "$RELEASE_TAG" ]; then
            printf 'release_tag is required when publish_release is enabled\n' >&2
            exit 2
          fi

      - name: Resolve GCC version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          min_gcc=15.3.0
          gcc_version=""

          if [ -n "$GCC_VERSION_INPUT" ]; then
            gcc_version="$GCC_VERSION_INPUT"
          elif [ "$BUILD_TARGET" = "auto-latest" ]; then
            # A manual dispatch may carry the watch workflow's parameters;
            # prefer the official kernel GCC it detected over the floor.
            official_gcc="$(printf '%s' "$AUTO_PARAMS" | jq -r '.official_gcc // empty' 2>/dev/null || true)"
            if [ -n "$official_gcc" ]; then
              gcc_version="$official_gcc"
            else
              gcc_version="$min_gcc"
            fi
          else
            case "$BUILD_TARGET" in
              full-7.4.0-beta.1)
                source_env=config/build-7.4.0-beta.1.env
                ;;
              full-6.18.44)
                source_env=config/build-6.18.44.env
                ;;
              full-6.18.43)
                source_env=config/build-6.18.43.env
                ;;
              *)
                printf 'Unsupported target: %s\n' "$BUILD_TARGET" >&2
                exit 2
                ;;
            esac
            unraid_zip_url="$(sed -n 's/^UNRAID_ZIP_URL=//p' "$source_env")"
            if [ -n "$unraid_zip_url" ]; then
              gcc_version="$(python3 scripts/extract-official-gcc.py --url "$unraid_zip_url" 2>/dev/null \
                | sed -n 's/^gcc=//p')" || true
            fi
          fi

          if [ -z "$gcc_version" ]; then
            gcc_version="$min_gcc"
          else
            gcc_version="$(printf '%s\n%s\n' "$min_gcc" "$gcc_version" | sort -V | tail -n1)"
          fi
          echo "gcc_version=$gcc_version" >> "$GITHUB_OUTPUT"
          printf 'Resolved GCC version: %s\n' "$gcc_version"

  build:
    needs: resolve-gcc
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      # Official GCC image for the resolved toolchain version.
      image: gcc:${{ needs.resolve-gcc.outputs.gcc_version }}
    env:
      BUILD_TARGET: ${{ inputs.target }}
      PUBLISH_RELEASE: ${{ inputs.publish_release }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      AUTO_PARAMS: ${{ inputs.auto_params }}
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake bc bison build-essential ca-certificates cpio \
            curl flex git gh initramfs-tools-core kmod libaio-dev \
            libattr1-dev libblkid-dev libcurl4-openssl-dev libelf-dev \
            libmount-dev libssl-dev libtirpc-dev libtool libudev-dev \
            libzstd-dev make pkg-config python3 tar unzip uuid-dev xz-utils zip zstd
          rm -rf /var/lib/apt/lists/*
          gcc --version
          g++ --version
          df -h .

      - name: Select a container-safe build configuration
        shell: bash
        run: |
          set -euo pipefail
          # The build job runs as root inside the container while checkout
          # files may belong to another uid; gh (release attach) and the
          # state update step call git and would hit "dubious ownership".
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          build_env="$RUNNER_TEMP/build.env"

          if [ "$BUILD_TARGET" = "auto-latest" ]; then
            # Parameters come from the watch-upstream workflow as JSON.
            [ -n "$AUTO_PARAMS" ] || {
              printf 'auto_params is required for target auto-latest\n' >&2
              exit 2
            }
            AUTO_PARAMS="$AUTO_PARAMS" python3 scripts/gen-auto-env.py > "$build_env"
          else
            case "$BUILD_TARGET" in
              full-7.4.0-beta.1)
                source_env=config/build-7.4.0-beta.1.env
                ;;
              full-6.18.44)
                source_env=config/build-6.18.44.env
                ;;
              full-6.18.43)
                source_env=config/build-6.18.43.env
                ;;
              *)
                printf 'Unsupported target: %s\n' "$BUILD_TARGET" >&2
                exit 2
                ;;
            esac
            cp "$source_env" "$build_env"
          fi

          compiler_version="$(gcc -dumpfullversion -dumpversion)"
          sed -i \
            -e 's|^CC=.*|CC=gcc|' \
            -e 's|^HOSTCC=.*|HOSTCC=gcc|' \
            -e 's|^CXX=.*|CXX=g++|' \
            -e 's|^HOSTCXX=.*|HOSTCXX=g++|' \
            -e "s|^EXPECTED_CC_VERSION=.*|EXPECTED_CC_VERSION=$compiler_version|" \
            -e 's|^JOBS=.*|JOBS=all|' \
            "$build_env"
          kernel_release="$(sed -n 's/^KERNEL_RELEASE=//p' "$build_env")"
          target_kernel_version="$(sed -n 's/^TARGET_KERNEL_VERSION=//p' "$build_env")"
          unraid_version="$(sed -n 's/^UNRAID_VERSION=//p' "$build_env")"
          printf 'BUILD_ENV_FILE=%s\n' "$build_env" >> "$GITHUB_ENV"
          printf 'EXPECTED_CC_VERSION=%s\n' "$compiler_version" >> "$GITHUB_ENV"
          printf 'KERNEL_RELEASE=%s\n' "$kernel_release" >> "$GITHUB_ENV"
          printf 'TARGET_KERNEL_VERSION=%s\n' "$target_kernel_version" >> "$GITHUB_ENV"
          printf 'UNRAID_VERSION=%s\n' "$unraid_version" >> "$GITHUB_ENV"
          printf 'Resolved build configuration:\n'
          sed -n '1,42p' "$build_env"

      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          cloud_dir=cloud-artifacts
          mkdir -p "$cloud_dir/logs"
          scripts/all.sh 2>&1 | tee "$cloud_dir/logs/unraid-build.log"
          (
            cd out
            for checksum in *.sha256; do
              [ -f "$checksum" ] || continue
              sha256sum -c "$checksum"
            done
            checksum_manifest="sha256sums-$KERNEL_RELEASE.txt"
            if [ -f "$checksum_manifest" ]; then
              sha256sum -c "$checksum_manifest"
            fi
          )

          zip_base="unRAIDServer-${UNRAID_VERSION}-Linux-${TARGET_KERNEL_VERSION}-x86_64.zip"
          artifacts=(
            "out/$zip_base"
            "out/$zip_base.sha256"
            "out/bzimage-$KERNEL_RELEASE"
            "out/bzroot-$KERNEL_RELEASE"
            # out/bzmodules is intentionally not uploaded: it is byte-identical
            # to the file in the official Unraid package (verified by
            # 50-verify.sh), so users keep the one they already have. Its
            # checksum still ships in sha256sums-*.txt for cross-checking.
            "out/sha256sums-$KERNEL_RELEASE.txt"
            "out/verification-$KERNEL_RELEASE.txt"
          )
          # Optional reference files, produced only by the rebuild modes.
          for optional_artifact in \
            out/zfs-installed-modules.txt \
            "config/generated-linux-$KERNEL_RELEASE.config"
          do
            [ -s "$optional_artifact" ] && artifacts+=("$optional_artifact")
          done

          for artifact in "${artifacts[@]}"; do
            [ -s "$artifact" ] || {
              printf 'Expected build output is missing: %s\n' "$artifact" >&2
              exit 1
            }
            cp "$artifact" "$cloud_dir/"
          done
          find "$cloud_dir" -maxdepth 1 -type f -size +0c -printf '%f\t%s bytes\n' \
            | sort > "$cloud_dir/cloud-build-manifest.txt"
          df -h .

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unraid-${{ inputs.target }}-${{ github.sha }}
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
          path: |
            cloud-artifacts/

      - name: Attach outputs to a release
        if: ${{ success() && inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_TAG" ] || {
            printf 'release_tag is required when publish_release is enabled\n' >&2
            exit 2
          }
          mapfile -t assets < <(
            find cloud-artifacts -maxdepth 1 -type f -size +0c \
              ! -name 'cloud-build-manifest.txt' -print | sort
          )
          [ "${#assets[@]}" -gt 0 ] || {
            printf 'No release assets were produced\n' >&2
            exit 1
          }
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Unraid ${UNRAID_VERSION} / kernel ${KERNEL_RELEASE}" \
              --notes "Official Unraid ${UNRAID_VERSION} package with the ${KERNEL_RELEASE} kernel from ich777/unraid_kernel swapped in." >/dev/null
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      - name: Update upstream state
        if: ${{ success() && inputs.target == 'auto-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > config/upstream-state.env <<EOF
          # State of the last successfully built release combination.
          # The watch-upstream workflow compares its detection results against
          # these values; the build workflow advances them after a successful
          # auto build.
          LAST_UNRAID_VERSION=${UNRAID_VERSION}
          LAST_KERNEL_RELEASE=${KERNEL_RELEASE}

          # GCC toolchain floor. Builds use max(MIN_GCC_VERSION, official kernel GCC).
          MIN_GCC_VERSION=15.3.0
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/upstream-state.env
          # Rebuilding the same version combination writes an identical state
          # file; a no-op must not fail the run after a successful release.
          if git diff --cached --quiet; then
            printf 'Upstream state already at %s / %s\n' "$UNRAID_VERSION" "$KERNEL_RELEASE"
          else
            git commit -m "ci: mark Unraid ${UNRAID_VERSION} / ${KERNEL_RELEASE} as built"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          printf 'Advanced upstream state to %s / %s\n' \
            "$UNRAID_VERSION" "$KERNEL_RELEASE"
